<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | Gear Sport</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a href="index.html">
                <img
                    src="pic/logo.png"
                    id="logo"
                    alt="Gear Sport"
                >
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarSupportedContent"
            >

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html#deportes"
                        >
                            Deportes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html#ropa"
                        >
                            Ropa
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html#zapatos"
                        >
                            Zapatos
                        </a>
                    </li>

                </ul>


                <!-- Carrito -->

                <a
                    href="carrito.html"
                    class="carrito-icono"
                >

                    <img
                        src="pic/carro.png"
                        class="icon"
                        alt="Carrito"
                    >

                    <span
                        id="contadorCarrito"
                        class="badge bg-danger"
                    >
                        0
                    </span>

                </a>


                <!-- Usuario -->

                <a href="#">
                    <img
                        src="pic/usuario.png"
                        class="icon"
                        alt="Usuario"
                    >
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= CARRITO ================= -->

    <main class="container my-5">

        <h1 class="mb-4">
            Mi carrito
        </h1>


        <div class="row">

            <!-- PRODUCTOS -->

            <div class="col-lg-8">

                <div id="listaCarrito"></div>

            </div>


            <!-- RESUMEN -->

            <div class="col-lg-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h4 class="mb-4">
                            Resumen del pedido
                        </h4>


                        <div
                            class="d-flex justify-content-between mb-2"
                        >

                            <span>
                                Subtotal
                            </span>

                            <span>
                                $<span id="subtotal">0.00</span>
                            </span>

                        </div>


                        <div
                            class="d-flex justify-content-between mb-3"
                        >

                            <span>
                                Envío
                            </span>

                            <span>
                                $<span id="envio">0.00</span>
                            </span>

                        </div>


                        <hr>


                        <div
                            class="d-flex justify-content-between mb-4"
                        >

                            <strong>
                                Total
                            </strong>

                            <strong>
                                $<span id="total">0.00</span>
                            </strong>

                        </div>


                        <button
                            id="btnComprar"
                            class="btn btn-dark w-100"
                        >
                            Proceder al pago
                        </button>


                        <a
                            href="index.html"
                            class="btn btn-outline-dark w-100 mt-2"
                        >
                            Seguir comprando
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="carrito.js"></script>

</body>

</html>
